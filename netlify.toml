# Nitro auto-detects Netlify during the build and uses its Netlify preset:
# static assets go to `dist/` and the SSR function to `.netlify/functions-internal/`.
[build]
  command = "bun run build"
  publish = "dist"

# Images uploaded in Lovable are referenced as /__l5e/assets-v1/..., a path only
# Lovable's hosting serves. Copies of the current logos live in public/ at the same
# paths; anything uploaded later is proxied from the Lovable project until copied too.
[[redirects]]
  from = "/__l5e/*"
  to = "https://f3529f16-1a9d-4a47-a60f-26de1a5e6e06.lovableproject.com/__l5e/:splat"
  status = 200
